<div class="container py-4">
  <div class="row mb-2">
    <div class="col-12">
      <h1 class="mb-0">Makler <small class="fs-5 text-muted fw-normal">Know Your Representative!</small></h1>
      <p class="text-muted mt-1">Centralised, publicly available information on Members of Parliament of the United Republic of Tanzania.</p>
    </div>
  </div>

  <div class="row align-items-center mb-3">
    <div class="col-md-6">
      <h2 class="mb-0">All Members</h2>
    </div>
    <div class="col-md-6 mt-2 mt-md-0">
      <input type="text" id="memberSearch" class="form-control" placeholder="Filter by name, party or area...">
    </div>
  </div>

  <div class="row g-3" id="membersGrid">
    {{ range $member := .membersList }}
    <div class="col-lg-3 col-md-4 col-sm-6 text-center member-card">
      <a href="/profile/{{$member.Id}}" class="text-decoration-none text-dark d-block p-3 rounded h-100">
        <img class="rounded-circle mx-auto d-block mb-2"
          src="{{$.assets}}/{{$member.Id}}.jpeg"
          alt="{{$member.Name}}"
          style="width: 90px; height: 90px; object-fit: cover;"
          onerror="this.src='/static/img/placeholder.png'">
        <h6 class="mb-0">{{$member.Name}}</h6>
        <small class="text-muted">{{$member.Group}}, {{$member.Area}}</small>
      </a>
    </div>
    {{ end }}
  </div>
</div>

<script>
  document.getElementById('memberSearch').addEventListener('input', function () {
    var q = this.value.toLowerCase();
    document.querySelectorAll('.member-card').forEach(function (card) {
      card.style.display = card.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
</script>
