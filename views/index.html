<div class="container">
    <div class="row">
        <div class="col-lg-12">
            <h1 class="into">Makler
                <small>Know Your Representative!</small>
            </h1>
            <p>This project centralize and provide publicly available information of member of parliaments of the United Republic
                of Tanzania</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-12">
            <h2 class="page-header">All Members</h2>
        </div>

        {{ range $member := .membersList }}
          <div class="col-lg-4 col-sm-6 text-center member-card mb-4">
            <a href="/profile/{{$member.Id}}">
                <img class="img-circle img-responsive img-center" 
                     src="{{$.assets}}/{{$member.Id}}.jpeg" 
                     alt="Photo of {{$member.Name}}" 
                     onerror="this.onerror=null;this.src='/static/placeholder.jpg';">
            </a>
            <h3 class="member-name">{{$member.Name}}</h3>
            <h4><small>{{$member.Group}}, {{$member.Area}}</small></h4>
          </div>
        {{ end }}
    </div>
